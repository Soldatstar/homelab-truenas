---
# Patch hosts, then write the report. Containers are patched before the Proxmox host that
# runs them. TrueNAS is only checked. Needs -e patch_confirm=true.
#   ansible-playbook playbooks/apply.yml -e patch_confirm=true
#   ansible-playbook playbooks/apply.yml -e patch_confirm=true --limit pve-example -e patch_reboot=true
#
# patch_scope narrows what is patched (default all):
#   host    OS packages of the SSH hosts and Proxmox nodes, not their containers
#   lxc     containers on the Proxmox nodes, not the nodes (-e '{"patch_lxc_only": [100]}' for one)
#   stacks  Docker compose projects (patch_compose_projects, or -e '{"patch_compose_projects": [...]}')
- name: Refuse to run without confirmation
  hosts: all
  gather_facts: false
  tasks:
    - name: Check patch_confirm
      ansible.builtin.assert:
        that: patch_confirm | bool
        fail_msg: "This changes hosts. Run check.yml first, then add -e patch_confirm=true."
      when: inventory_hostname == ansible_play_hosts_all[0] # not on localhost: --limit leaves it out

    - name: Check patch_scope
      ansible.builtin.assert:
        that: (patch_scope | default('all')) in ['all', 'host', 'lxc', 'stacks']
        fail_msg: "patch_scope must be one of all, host, lxc, stacks."
      when: inventory_hostname == ansible_play_hosts_all[0]

- name: Proxmox containers
  hosts: proxmox
  serial: "{{ patch_serial | default(1) }}"
  max_fail_percentage: 0
  vars:
    patch_mode: apply
  roles:
    - role: patch_lxc
      when: (patch_scope | default('all')) in ['all', 'lxc']

- name: Debian, Raspberry Pi OS and Proxmox hosts
  hosts: debian:pi_os:proxmox
  serial: "{{ patch_serial | default(1) }}"
  max_fail_percentage: 0
  vars:
    patch_mode: apply
  roles:
    - role: patch_apt
      when: (patch_scope | default('all')) in ['all', 'host']

- name: Docker
  hosts: docker
  gather_facts: false
  serial: "{{ patch_serial | default(1) }}"
  max_fail_percentage: 0
  vars:
    patch_mode: apply
  roles:
    - role: patch_docker
      when: (patch_scope | default('all')) in ['all', 'stacks']

- name: TrueNAS (check only)
  hosts: truenas
  gather_facts: false
  roles:
    - patch_truenas

- name: Write the report
  hosts: localhost
  connection: local
  vars:
    ansible_become: false # the inventory enables it for the SSH targets
    patch_mode: apply
  roles:
    - patch_report
