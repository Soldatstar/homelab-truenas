---
# The vllm-radiance image has no download logic; it only reads /models.
# Weights are fetched into a plain directory with huggingface_hub.

- name: Install huggingface_hub into a dedicated virtualenv
  ansible.builtin.pip:
    name: "huggingface_hub{{ llm_models_hf_hub_spec | default('>=0.30') }}"
    virtualenv: "{{ llm_base_dir }}/hf-venv"
    virtualenv_command: python3 -m venv

- name: Install the snapshot download helper
  ansible.builtin.copy:
    src: hf_snapshot.py
    dest: "{{ llm_base_dir }}/bin/hf_snapshot.py"
    owner: root
    group: root
    mode: "0755"

- name: Download the model checkpoint (about 20 GB on first run)
  ansible.builtin.command:
    argv:
      - "{{ llm_base_dir }}/hf-venv/bin/python"
      - "{{ llm_base_dir }}/bin/hf_snapshot.py"
      - "{{ llm_model_repo }}"
      - "{{ llm_model_revision }}"
      - "{{ llm_models_dir }}/{{ llm_model_dirname }}"
    creates: "{{ llm_models_dir }}/{{ llm_model_dirname }}/.complete-{{ llm_model_revision }}"
  environment:
    HF_HOME: "{{ llm_hf_cache_dir }}"
    HF_TOKEN: "{{ vault_hf_token | default('') }}"
  async: 21600
  poll: 30
  no_log: true
