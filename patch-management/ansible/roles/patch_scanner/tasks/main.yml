---
# Runs inside the scanner container, connected as root. The daily job runs as an ordinary user.
- name: Install the tools
  ansible.builtin.apt:
    name:
      - ansible
      - rsync
      - openssh-client
      - curl
      - ca-certificates
      - nginx
      - openssl
      - prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the scanner user with its own SSH key
  ansible.builtin.user:
    name: "{{ patch_scanner_user }}"
    shell: /bin/bash
    create_home: true
    generate_ssh_key: true
    ssh_key_type: ed25519
    ssh_key_comment: "patch-scanner"
  register: patch_scanner_account

- name: Remember the scanner's public key
  ansible.builtin.set_fact:
    patch_scanner_pubkey: "{{ patch_scanner_account.ssh_public_key }}"

- name: Trust the host keys of every target (checked from the machine running this play)
  ansible.builtin.known_hosts:
    path: "{{ patch_scanner_home }}/.ssh/known_hosts"
    name: "{{ hostvars[item].ansible_host }}"
    key: "{{ lookup('ansible.builtin.pipe', 'ssh-keyscan -T 5 -t ed25519,ecdsa,rsa ' ~ hostvars[item].ansible_host ~ ' 2>/dev/null | grep -v ^# | head -n 1') }}"
  when: hostvars[item].ansible_host is defined
  loop: "{{ groups['all'] | difference(groups['scanner']) }}"

- name: Fix ownership of the known hosts file
  ansible.builtin.file:
    path: "{{ patch_scanner_home }}/.ssh/known_hosts"
    owner: "{{ patch_scanner_user }}"
    group: "{{ patch_scanner_user }}"
    mode: "0644"
  failed_when: false

- name: Copy the project (including the local inventory) to the scanner
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../"
    dest: "{{ patch_scanner_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=reports/*"
      - "--exclude=__pycache__"
      - "--exclude=.ansible"
      - "--chown={{ patch_scanner_user }}:{{ patch_scanner_user }}"

- name: Put the metrics exporter next to the project
  ansible.builtin.copy:
    src: export_metrics.py
    dest: "{{ patch_scanner_dir }}/export_metrics.py"
    owner: "{{ patch_scanner_user }}"
    group: "{{ patch_scanner_user }}"
    mode: "0755"

- name: Make the report directory (also the web root)
  ansible.builtin.file:
    path: "{{ patch_scanner_reports_dir }}"
    state: directory
    owner: "{{ patch_scanner_user }}"
    group: "{{ patch_scanner_user }}"
    mode: "0755"

- name: Keep reports written before this directory existed
  ansible.builtin.command: cp -an {{ patch_scanner_dir }}/reports/. {{ patch_scanner_reports_dir }}/
  args:
    creates: "{{ patch_scanner_reports_dir }}/patch-report.md"
  become_user: "{{ patch_scanner_user }}"

- name: Let the scanner write the metrics file
  ansible.builtin.file:
    path: "{{ patch_scanner_textfile_dir }}"
    state: directory
    owner: "{{ patch_scanner_user }}"
    mode: "0755"

- name: Install the daily job
  ansible.builtin.template:
    src: patch-scan-daily.sh.j2
    dest: /usr/local/bin/patch-scan-daily
    mode: "0755"

- name: Install the systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - patch-scan.service
    - patch-scan.timer
  notify: Reload systemd

- name: Serve the reports to the LAN
  ansible.builtin.template:
    src: nginx-patch-reports.conf.j2
    dest: /etc/nginx/conf.d/patch-reports.conf
    mode: "0644"
  notify: Reload nginx

- name: Remove the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

# ---- patch control page ------------------------------------------------------------------
- name: Make sure the folder for the generated password exists (on the machine running Ansible)
  ansible.builtin.file:
    path: "{{ patch_scanner_control_password_file | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: Generate the login password once (kept outside the repository)
  ansible.builtin.set_fact:
    patch_scanner_control_password: "{{ lookup('ansible.builtin.password', patch_scanner_control_password_file, length=24, chars=['ascii_letters', 'digits']) }}"
  no_log: true

- name: Hash the password for nginx
  ansible.builtin.command: openssl passwd -apr1 -salt {{ (patch_scanner_control_password | hash('sha256'))[:8] }} -stdin
  args:
    stdin: "{{ patch_scanner_control_password }}"
  register: patch_scanner_control_hash
  changed_when: false
  no_log: true

- name: Install the login file
  ansible.builtin.copy:
    content: "{{ patch_scanner_control_user }}:{{ patch_scanner_control_hash.stdout }}\n"
    dest: /etc/nginx/patch-control.htpasswd
    owner: root
    group: www-data
    mode: "0640"
  no_log: true
  notify: Reload nginx

- name: Create a self-signed certificate (valid 10 years; browsers will warn once)
  ansible.builtin.command: >-
    openssl req -x509 -newkey rsa:3072 -nodes -days 3650
    -subj "/CN={{ inventory_hostname }}" -addext "subjectAltName=IP:{{ ansible_host }}"
    -keyout /etc/ssl/private/patch-control.key -out /etc/ssl/certs/patch-control.crt
  args:
    creates: /etc/ssl/certs/patch-control.crt
  notify: Reload nginx

- name: Put the control page in place
  ansible.builtin.file:
    path: "{{ patch_scanner_control_dir }}"
    state: directory
    mode: "0755"

- name: Install the control page
  ansible.builtin.copy:
    src: patch_control.py
    dest: "{{ patch_scanner_control_dir }}/patch_control.py"
    mode: "0755"
  notify: Restart patch control

- name: Make the state folder (jobs and logs)
  ansible.builtin.file:
    path: "{{ patch_scanner_control_state }}"
    state: directory
    owner: "{{ patch_scanner_user }}"
    group: "{{ patch_scanner_user }}"
    mode: "0700"

- name: Install the control page service
  ansible.builtin.template:
    src: patch-control.service.j2
    dest: /etc/systemd/system/patch-control.service
    mode: "0644"
  notify: Restart patch control

- name: Serve the control page over TLS
  ansible.builtin.template:
    src: nginx-patch-control.conf.j2
    dest: /etc/nginx/conf.d/patch-control.conf
    mode: "0644"
  notify: Reload nginx

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Start the services
  ansible.builtin.systemd:
    name: "{{ item.name }}"
    enabled: true
    state: "{{ item.state }}"
  loop:
    - {name: nginx, state: started}
    - {name: prometheus-node-exporter, state: started}
    - {name: patch-scan.timer, state: started}
    - {name: patch-control, state: started}
