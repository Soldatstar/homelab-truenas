---
# The vllm-radiance image has no download logic; it only reads /models.
# Weights are fetched into plain directories with huggingface_hub.

- name: Install the download tooling
  ansible.builtin.include_tasks: helper.yml

# Downloads every configured model (about 20 GB and 29 GB) so a switch needs no download.
# Set llm_models_download_all: false to fetch only the selected one.
- name: Download the model checkpoints
  ansible.builtin.command:
    argv:
      - "{{ llm_base_dir }}/hf-venv/bin/python"
      - "{{ llm_base_dir }}/bin/hf_snapshot.py"
      - "{{ item.value.repo }}"
      - "{{ item.value.revision }}"
      - "{{ llm_models_dir }}/{{ item.value.dirname }}"
    creates: "{{ llm_models_dir }}/{{ item.value.dirname }}/.complete-{{ item.value.revision }}"
  environment:
    HF_HOME: "{{ llm_hf_cache_dir }}"
    HF_TOKEN: "{{ vault_hf_token | default('') }}"
  loop: "{{ llm_models | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: llm_models_download_all | bool or item.key == llm_model
  async: 21600
  poll: 30
  no_log: true
