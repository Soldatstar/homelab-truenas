---
# ---------------------------------------------------------------------------
# Network and exposure
# ---------------------------------------------------------------------------
llm_lan_ip: "{{ ansible_host }}"
llm_lan_interface: eno1np0
llm_admin_subnet: 192.168.1.0/24 # SSH is allowed from here only
llm_proxy_ip: 192.168.1.10 # NPM Plus; Open WebUI trusts forwarded headers from it

# Sources allowed to open NEW connections to Docker-published ports 3000 and
# 8000 (enforced in the DOCKER-USER chain, see roles/llm_firewall). Everything
# else is dropped. To admit only the proxy, use ["{{ llm_proxy_ip }}"].
llm_allowed_sources:
  - 192.168.1.0/24
# Further sources on top of the list above (appended, not replacing it).
llm_extra_allowed_sources: []

llm_chat_domain: chat.viktornote.ch
llm_api_domain: llm.viktornote.ch

llm_api_port: 8000 # inference API (OpenAI + Anthropic Messages)
llm_webui_port: 3000 # Open WebUI
llm_searxng_port: 8888 # SearXNG on the LAN, only with openwebui_searxng_publish

# ---------------------------------------------------------------------------
# Paths (the host has one 1.8T NVMe mounted at /, so everything lives there)
# ---------------------------------------------------------------------------
llm_base_dir: /opt/llm # compose projects, helper scripts
llm_data_dir: /srv/llm # models, caches, application data
llm_models_dir: "{{ llm_data_dir }}/models"
llm_hf_cache_dir: "{{ llm_data_dir }}/hf-cache"
llm_engine_cache_dir: "{{ llm_data_dir }}/vllm-cache" # Triton/inductor/AITER/vLLM JIT caches
docker_data_root: /var/lib/docker # already on the NVMe; change before first run only
llm_docker_network: llm
llm_backend_alias: llm-backend # DNS name of the active engine on the Docker network

# ---------------------------------------------------------------------------
# Engine and model
# ---------------------------------------------------------------------------
# vllm_radiance  = magiccodingman/vllm-radiance (default, qualified)
# radiance_engine = StillDeadcode/radiance (optional, untested skeleton)
llm_engine: vllm_radiance

# Which model is loaded. Only ONE model runs at a time (both would need 47 GiB of
# weights and leave almost no KV cache). Switch with:
#   ansible-playbook playbooks/site.yml ... --tags models,engine -e llm_model=fp8
llm_model: mxfp4

# Every entry here is downloaded (llm_models_download_all), so switching does not wait
# for a download. Revisions are Hugging Face commits at the time of writing (2026-11-10);
# bump them deliberately.
llm_models:
  mxfp4: # 18.4 GiB weights, leaves the largest KV pool; upstream-qualified
    repo: amd/Qwen3.8-27B-Quark-AWQ-MXFP4
    revision: 93245f7c00f1a8964b66a97c6e02e2fd09080be4
    dirname: Qwen3.8-27B-Quark-AWQ-MXFP4
    weight_format: mxfp4
    gpu_util: 0.90
    profile: chat
  fp8: # 28.75 GiB weights, higher precision, smaller KV pool. UNTESTED here: upstream
    # measured a different FP8 checkpoint (a "heretic-ara" variant), though it lists the
    # official Qwen3.8-27B-FP8 among its tested setups.
    repo: Qwen/Qwen3.8-27B-FP8
    revision: c3a462cc3d38cf351f3b26cbd763469eeb74ef81
    dirname: Qwen3.8-27B-FP8
    weight_format: fp8
    gpu_util: 0.85
    profile: chat-fp8
llm_models_download_all: true

llm_model_repo: "{{ llm_models[llm_model].repo }}"
llm_model_revision: "{{ llm_models[llm_model].revision }}"
llm_model_dirname: "{{ llm_models[llm_model].dirname }}"
llm_model_weight_format: "{{ llm_models[llm_model].weight_format }}" # mxfp4 | fp8

# Clients use these names, which stay the same whichever model is loaded, so Open WebUI and
# Claude Code need no change when you switch. The third name shows what is actually loaded.
llm_served_model_name: qwen3.8-27b
llm_served_model_aliases:
  - claude-local
  - "qwen3.8-27b-{{ llm_model }}"

# ---------------------------------------------------------------------------
# Serving profile. max_num_seqs is an admission ceiling, not a reservation:
# vLLM allocates KV blocks on demand from one shared pool (about 576K tokens
# with prefix caching + align, per upstream's boot log at 90% allocation).
# Never use max_num_seqs 1: Open WebUI background tasks and Claude Code's
# small-model/subagent calls need their own sequences.
# ---------------------------------------------------------------------------
# The default profile follows the selected model; override with -e llm_profile=long.
llm_profile: "{{ llm_models[llm_model].profile }}"
llm_profiles:
  chat: # MXFP4: upstream-qualified production profile (prefix cache + align)
    max_model_len: 131072
    max_num_seqs: 4
  long: # MXFP4, UNTESTED: upstream ran 262144 only with prefix caching off
    max_model_len: 262144
    max_num_seqs: 4
  coding: # MXFP4, UNTESTED with prefix caching on, like "long" but fewer sequences
    max_model_len: 262144
    max_num_seqs: 2
  chat-fp8: # FP8: upstream's FP8 capacity table lists 128K x 2 (85%, other checkpoint)
    max_model_len: 131072
    max_num_seqs: 2
  long-fp8: # FP8, UNTESTED: the KV pool holds about one full 256K sequence
    max_model_len: 262144
    max_num_seqs: 2
llm_profile_settings: "{{ llm_profiles[llm_profile] }}"

vllm_gpu_memory_utilization: "{{ llm_models[llm_model].gpu_util }}"
vllm_max_num_batched_tokens: 4096
vllm_hip_visible_devices: "0,1"
# Qwen3.8's template accepts only low, medium and xhigh (upstream default: xhigh).
# Requests may override it per call.
vllm_default_reasoning_effort: medium
vllm_prefix_caching: true # --enable-prefix-caching + --mamba-cache-mode=align
vllm_health_timeout_minutes: 45 # first start compiles kernels and captures graphs
vllm_radiance_expected_version: 1.1.0-rc1.vllm0.30.0 # /opt/radiance_version in the image

# Experimental upstream features. All OFF: none has passed upstream's strict
# output-equivalence gate, and MTP failed the tool-call gate. See README.
vllm_experimental:
  speculative_config: "" # raw JSON for --speculative-config (MTP or DFlash)
  compilation_config: "" # raw JSON, DFlash2 needs {"cudagraph_mode":"PIECEWISE"}
  v2_model_runner: false # required by DFlash2
  fast_draft: false
  quark_bf16_mtp: false # only with MTP on the Quark checkpoint
  normquant_fusion: false # upstream: do not enable in production
  fp8_stream: false # upstream: do not enable in production
  gdn_norm_quant: false
  r4d_attn_fp8: 0 # 3 enables FP8 QK/PV prefill legs
  kv_offloading_size: "" # GiB of CPU KV tier

# ---------------------------------------------------------------------------
# Host preparation
# ---------------------------------------------------------------------------
# Extra kernel command line, e.g. "iommu=pt". Empty: IOMMU is currently off on
# this host (no iommu groups), which is the simplest setup for GPU P2P.
host_prep_kernel_cmdline_extra: ""
host_prep_hold_packages:
  - linux-generic
  - linux-image-generic
  - linux-headers-generic
  - linux-firmware
  - linux-firmware-amd-graphics
host_prep_unattended_blacklist:
  - "linux-image"
  - "linux-headers"
  - "linux-modules"
  - "linux-generic"
  - "linux-firmware"
  - "docker-ce"
  - "containerd.io"

# ---------------------------------------------------------------------------
# Open WebUI
# ---------------------------------------------------------------------------
# Extra browser origins allowed besides https://<llm_chat_domain>. Needed when you open
# Open WebUI by its LAN address instead of through the proxy; set to [] to allow the
# proxy domain only.
openwebui_extra_origins:
  - "http://{{ llm_lan_ip }}:{{ llm_webui_port }}"
openwebui_postgres_enabled: false # SQLite is plenty for a household
openwebui_searxng_enabled: true # web search, no VRAM
# Publish SearXNG on llm_lan_ip:llm_searxng_port, for search tools on other machines (Claude
# Code, see ../claude-code/mcp.json). It has no login and no rate limit. Who can connect is the
# same source list as for every published port (llm_allowed_sources, see roles/llm_firewall).
openwebui_searxng_publish: true
# Engine changes on top of SearXNG's defaults (this also affects Open WebUI's web search).
# Measured from this host on 2026-11-25: google cse and duckduckgo worked (duckduckgo not every
# time: captcha and parser errors in the log), yahoo worked, bing returned unrelated results,
# google and qwant answered "access denied", brave was suspended for too many requests and
# wikidata for access denied.
openwebui_searxng_engines_on: [yahoo]
openwebui_searxng_engines_off: [brave, wikidata] # they only added "unavailable" warnings
openwebui_rag_embedding_model: sentence-transformers/all-MiniLM-L6-v2 # runs on CPU
# Background tasks each take a sequence on the same model for a few seconds.
openwebui_task_model: "{{ llm_cpu_served_name if (llm_cpu_model_enabled and llm_cpu_use_for_tasks) else llm_served_model_name }}"
# Model shown first in new chats. "" = the served model itself. A preset id works too.
openwebui_default_model: ""
# Presets created through Open WebUI's API (roles/open_webui/tasks/presets.yml); each is a custom
# model on top of the served model with its own parameters. The flash-next playbook fills this
# from the radiance_models entry. Edit presets in group_vars, not in the UI: with
# openwebui_presets_update they are rewritten on every run. Presets start private to the admin.
openwebui_model_presets: []
openwebui_presets_update: true
openwebui_title_generation: true
openwebui_tags_generation: true
openwebui_follow_up_generation: true
openwebui_autocomplete_generation: false # fires on every keystroke pause
# OIDC login with Authentik. Create an OAuth2/OpenID provider there with the redirect
# URI https://<llm_chat_domain>/oauth/oidc/callback (strict), then store the client
# secret as vault_webui_oauth_client_secret and set the flag to true.
# The container resolves and calls the Authentik host itself, not only your browser.
openwebui_oauth_enabled: true
openwebui_oauth_provider_name: Authentik
openwebui_oauth_client_id: 9yNg8fMA1XOD9Pq70LvdJcZRpumT6Qv4yST5tFzR
openwebui_oauth_provider_url: https://authentik.viktornote.ch/application/o/open-web-ui/.well-known/openid-configuration
# Trusted-header SSO (Authentik via NPM Plus). Only safe because the firewall
# admits only your LAN, so keep the proxy as the sole route to port 3000 (or
# narrow llm_allowed_sources to the proxy) before enabling this.
# Example: X-authentik-email
openwebui_trusted_email_header: ""
openwebui_trusted_name_header: ""

# ---------------------------------------------------------------------------
# Optional components
# ---------------------------------------------------------------------------
# A small model served from system RAM (llama.cpp, CPU only) for simple jobs. It shows up
# in Open WebUI's model list next to the GPU model. Internal only, no published port.
# A 35B model with 3B active parameters suits CPUs: each token reads little memory.
llm_cpu_model_enabled: true
llm_cpu_model_repo: ggml-org/Qwen3.6-35B-A3B-GGUF
llm_cpu_model_revision: eb0b3cc97fecddab7eee6e6ffdbe92d2a00afcea # HF commit, 2026-11-10
llm_cpu_model_file: Qwen3.6-35B-A3B-Q4_K_M.gguf # 19.1 GiB
llm_cpu_served_name: qwen3.6-35b-a3b-cpu
llm_cpu_threads: 24 # decoding; the host has 96 hardware threads
llm_cpu_threads_batch: 32 # prompt processing
llm_cpu_cpu_limit: 32 # hard cap for the container, so the GPU engine keeps its CPU
llm_cpu_parallel: 2 # concurrent requests
llm_cpu_ctx_per_slot: 32768 # context per request (the total is split between the slots)
# Thinking before answering is far too slow on a CPU, so it is off by default. Set true to
# let the model reason (better answers on hard questions, minutes of waiting).
llm_cpu_thinking: false
# Send Open WebUI's background jobs (titles, tags, follow-ups, search queries) to this
# model instead of the GPU model, so they stop taking GPU sequences from your chat.
llm_cpu_use_for_tasks: false

# Standalone radiance engine (roles/radiance_engine), used by playbooks/flash-next.yml or
# with llm_engine: radiance_engine. Serves one Qwen3.8-Flash-Next .rad model on both GPUs.
# The experts (114 GiB) do not fit the cards, so the engine keeps the hot ones in VRAM and
# streams the rest from pinned host RAM.
#
# Pick a model and a context profile (both can be overridden per run):
#   ansible-playbook playbooks/flash-next.yml ... -e radiance_model=uncensored_v4 -e radiance_profile=long
radiance_model: stock
radiance_profile: card

# One entry per .rad file. Every entry carries its own engine image, because the files are
# built for different radiance generations: the v4 file needs radiance 2.0.0 or newer, and
# its card says 2.x no longer serves the older fp8-iq4r-moe file. Do not point the stock
# entry at the 2.x image without testing it.
radiance_models:
  stock: # StillDeadcode's quantization of Qwen's own model
    repo: StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe # "" = file already in place
    revision: 8267a67384583f6be309981baf878b09ff900a9a # HF commit, 2026-10-03
    file: qwen3.8-next-flash-fp8-iq4r-moe.rad # inside {{ llm_models_dir }}/rad
    image: "{{ radiance_engine_image }}"
    config: cli # radiance 1.x takes command-line flags
    served_name: "" # model id clients see; the 1.x engine picks its own (metrics show "qwen4exp")
    kv_cache_dtype: fp8
    expert_vs_cache_ratio: "" # the model card's 0.82; 1.17.0 rejects --expert-vs-cache-ratio
    ngram_placement: ram # ~48 GiB pinned; "disk" only on NVMe (about 7x slower on HDD)
  uncensored_v4: # orcarouter's abliterated model, IQR-V4 recipe. Refusals removed.
    # Its author served it once (radiance 2.1.0, one card, a handful of plain questions).
    # No speed, refusal-rate or 2-card numbers exist; judge it yourself.
    repo: StillDeadcode/qwen3.8-next-flash-uncensored-iqr-v4
    revision: f2a1cd87884dd2df2787c7d9efb8005b13f6a6da # HF commit, 2026-11-16
    file: qwen3.8-next-flash-uncensored-iqr-v4.rad
    image: "{{ radiance_engine_image_v2 }}"
    config: yaml # radiance 2.x takes a YAML file (--config) and refuses command-line flags
    served_name: flashnext-uncensored # the YAML key = the model id in /v1/models and Open WebUI
    webui_default_model: flashnext-think # new chats in Open WebUI start on this preset
    webui_presets: # see docs/flash-next-settings.md; sampling is left to the engine except for Fast
      - id: flashnext-think
        name: "Qwen 3.8 Flash-Next Think"
        description: "Qwen 3.8 Flash-Next, thinking at medium effort. The everyday setting."
        tags: ["Qwen 3.8"]
        params: {reasoning_effort: medium, function_calling: native}
        capabilities: {usage: true}
      - id: flashnext-deep
        name: "Qwen 3.8 Flash-Next Deep"
        description: "Qwen 3.8 Flash-Next, thinking at the highest effort, with room for a long answer. Slower."
        tags: ["Qwen 3.8"]
        params: {reasoning_effort: xhigh, max_tokens: 32768, function_calling: native}
        capabilities: {usage: true}
      - id: flashnext-fast
        name: "Qwen 3.8 Flash-Next Fast"
        description: "Qwen 3.8 Flash-Next, thinking off, Qwen's non-thinking sampling. Quick replies."
        tags: ["Qwen 3.8"]
        params: {reasoning_effort: none, temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, presence_penalty: 1.5, function_calling: native}
        capabilities: {usage: true}
    kv_cache_dtype: i8
    expert_vs_cache_ratio: ""
    ngram_placement: "" # no flag: this file reads its n-gram table from disk, keep it on NVMe
radiance_model_settings: "{{ radiance_models[radiance_model] }}"

# Context profiles. The model was trained for 262,144 tokens, so "long" and "xlong" stretch it
# with YaRN (rope-scaling yarn:2, up to 524,288). The setting comes from one forum report; radiance
# 2.1.0 does echo it back when it converts a command line to its YAML format, so it knows the key,
# but nobody has shown it working at 400K here. Recall at the far end of the window may drop. The KV cache is small (about 1.1M tokens fit in VRAM), so context
# length is limited by the rope range and by prefill time, not by host RAM.
radiance_profiles:
  card: # the model card's serve command
    max_model_len: 200000
    max_num_seqs: 8
    rope_scaling: "" # "" = none
  native: # the model's trained length: no rope stretching, 4 sequences, pool about 1.05M tokens
    max_model_len: 262144
    max_num_seqs: 4
    rope_scaling: ""
    host_pool_mib: 20480
  long:
    max_model_len: 409600
    max_num_seqs: 2
    rope_scaling: "yarn:2"
    host_pool_mib: 20480 # pinned per rank; a bigger pool frees VRAM for cache (see below)
  xlong:
    max_model_len: 500000
    max_num_seqs: 2
    rope_scaling: "yarn:2"
    host_pool_mib: 20480
radiance_profile_settings: "{{ radiance_profiles[radiance_profile] }}"
# A profile may set host_pool_mib; otherwise radiance_engine_host_pool_mib below applies. Measured
# KV pools (tokens): card 1.10M, 300K x 4 1.13M (stock file); v4 at 409,600 x 2 416,120 with the
# default 12288. The v4 log showed the pool only half used (6.6 of 12 GiB), so raising it may not
# help: check the "kv cache ... tokens" line in `docker logs radiance` after each change.

radiance_engine_min_free_gib: 130 # disk needed before the download starts
radiance_engine_min_ram_gib: 96 # host RAM needed with ngram placement in RAM
radiance_engine_tp_wire: wht6 # wht6 is lossy for large messages; "exact" costs 5-10% speed
radiance_engine_placement: expert_tiered
radiance_engine_host_pool_mib: 12288 # default, pinned per GPU rank (x2 cards); profiles can override
radiance_engine_gpu_headroom_mib: 96
radiance_engine_spec_tokens: 3 # MTP speculative tokens
radiance_engine_max_batched_tokens: 2048
radiance_engine_prefix_cache_mib: 4096 # 0 omits the flag
radiance_engine_extra_args: [] # raw extra flags for "config: cli" models, e.g. ["--reasoning-effort-map", "high=xhigh"]
# Extra keys for "config: yaml" models (radiance 2.1.0; the names are the ones `radiance --help` lists).
# Verified on the host: reasoning-effort-map, reasoning-effort, thinking-token-budget, temp, top-k,
# top-p, min-p, presence-penalty, chat-template-kwargs, reasoning-format, generation-config.
#   reasoning-effort-map: "high=xhigh"  # Open WebUI sends low/medium/high; the engine rejects "high"
#   reasoning-effort: medium            # server default for clients that send none (stock: xhigh)
#   thinking-token-budget: 8192         # cap runaway thinking for clients that send none
# Not set as defaults: coding agents that send no effort are better left on xhigh.
radiance_engine_extra_config:
  reasoning-effort-map: "high=xhigh"
radiance_engine_health_timeout_minutes: 45

# Only needed if the engine's native /v1/messages fails the smoke test.
litellm_enabled: false
litellm_port: 4000

# Dashboard: Prometheus + Grafana on this host, with a ready-made dashboard (tokens/s,
# requests, KV cache, latency, GPU temperature/fan/VRAM). Store the Grafana admin password
# as vault_grafana_admin_password, then set this to true. Grafana: http://<llm_lan_ip>:3001
llm_dashboard_enabled: true
llm_grafana_port: 3001
llm_prometheus_retention: 30d

# node-exporter with AMD GPU sysfs metrics. Implied by the dashboard; enable it on its
# own only to scrape from a Prometheus server elsewhere (vLLM /metrics is always served
# on the API port).
llm_metrics_enabled: "{{ llm_dashboard_enabled }}"
llm_metrics_port: 9100
llm_metrics_sources: [] # external Prometheus server IPs
