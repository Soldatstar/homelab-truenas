---
# Standalone radiance engine (codeberg.org/StillDeadcode/radiance), selected with
# llm_engine: radiance_engine or deployed on its own with playbooks/flash-next.yml.
#
# Serves one .rad model on both GPUs. The default is Qwen3.8-Flash-Next (114 GiB), whose
# experts do not fit in VRAM: the engine keeps the hot ones on the cards and streams the
# rest from pinned host RAM, so this role also checks that the host has the memory.

- name: Assert the model settings are complete
  ansible.builtin.assert:
    that:
      - radiance_model_settings.file | length > 0
      - radiance_profile_settings.max_num_seqs | int >= 2
    fail_msg: >-
      Each radiance_models entry needs a file name (inside {{ llm_models_dir }}/rad), and the
      selected profile needs max_num_seqs of 2 or more: Open WebUI and Claude Code make small
      background requests that need their own sequence.
    quiet: true

- name: Install the download tooling
  ansible.builtin.include_role:
    name: llm_models
    tasks_from: helper
  when: radiance_model_settings.repo | length > 0

- name: Create the radiance directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ llm_base_dir }}/radiance"
    - "{{ llm_models_dir }}/rad"

- name: Check the model file
  ansible.builtin.stat:
    path: "{{ llm_models_dir }}/rad/{{ radiance_model_settings.file }}"
  register: radiance_engine_model

- name: Check free disk space for the download
  ansible.builtin.command:
    argv: [df, --output=avail, -B1, "{{ llm_models_dir }}"]
  register: radiance_engine_df
  changed_when: false
  when:
    - radiance_model_settings.repo | length > 0
    - not radiance_engine_model.stat.exists

- name: Assert there is room for the model
  ansible.builtin.assert:
    that: (radiance_engine_df.stdout_lines[-1] | trim | int) > (radiance_engine_min_free_gib | int * 1024 * 1024 * 1024)
    fail_msg: "Less than {{ radiance_engine_min_free_gib }} GiB free under {{ llm_models_dir }}."
    quiet: true
  when:
    - radiance_model_settings.repo | length > 0
    - not radiance_engine_model.stat.exists

- name: Download the .rad model (about 114 GiB on first run)
  ansible.builtin.command:
    argv:
      - "{{ llm_base_dir }}/hf-venv/bin/python"
      - "{{ llm_base_dir }}/bin/hf_snapshot.py"
      - "{{ radiance_model_settings.repo }}"
      - "{{ radiance_model_settings.revision }}"
      - "{{ llm_models_dir }}/rad"
      - "{{ radiance_model_settings.file }}"
    creates: "{{ llm_models_dir }}/rad/.complete-{{ radiance_model_settings.revision }}"
  environment:
    HF_HOME: "{{ llm_hf_cache_dir }}"
    HF_TOKEN: "{{ vault_hf_token | default('') }}"
  async: 43200
  poll: 60
  no_log: true
  when: radiance_model_settings.repo | length > 0

- name: Check the model file exists
  ansible.builtin.stat:
    path: "{{ llm_models_dir }}/rad/{{ radiance_model_settings.file }}"
  register: radiance_engine_model_final
  when: not ansible_check_mode

- name: Fail when the model file is missing
  ansible.builtin.assert:
    that: radiance_engine_model_final.stat.exists
    fail_msg: >-
      {{ llm_models_dir }}/rad/{{ radiance_model_settings.file }} not found. Set
      the model's repo to download it, or copy a .rad file there.
    quiet: true
  when: not ansible_check_mode

# The pinned pools (host pool and n-gram table) cannot be swapped out, so a host that is
# short of RAM would fail late, after the long model load.
- name: Assert the host has enough RAM for the pinned pools
  ansible.builtin.assert:
    that: ansible_facts.memtotal_mb | int >= radiance_engine_min_ram_gib | int * 1024
    fail_msg: >-
      The host has {{ ansible_facts.memtotal_mb }} MiB of RAM; this configuration needs about
      {{ radiance_engine_min_ram_gib }} GiB. Use a model entry with ngram_placement: disk (NVMe only).
    quiet: true
  when: radiance_model_settings.ngram_placement == 'ram'

- name: Look up the render and video group ids
  ansible.builtin.getent:
    database: group

- name: Write the radiance secrets file
  ansible.builtin.copy:
    dest: "{{ llm_base_dir }}/radiance/radiance.env"
    content: |
      RADIANCE_API_KEY={{ vault_llm_api_key }}
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Refuse command-line extras for a YAML-configured model
  ansible.builtin.assert:
    that: radiance_model_settings.config != 'yaml' or radiance_engine_extra_args | length == 0
    fail_msg: >-
      radiance_engine_extra_args are command-line flags and this model's engine reads a YAML
      file. Put them in radiance_engine_extra_config as key: value pairs instead.
    quiet: true

- name: Template the radiance settings file (YAML models)
  ansible.builtin.template:
    src: radiance.yaml.j2
    dest: "{{ llm_base_dir }}/radiance/radiance.yaml"
    owner: root
    group: root
    mode: "0644"
  register: radiance_engine_yaml
  when: radiance_model_settings.config == 'yaml'

- name: Template the radiance compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ llm_base_dir }}/radiance/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start radiance (recreates the container when the settings change)
  community.docker.docker_compose_v2:
    project_src: "{{ llm_base_dir }}/radiance"
    state: present
    pull: missing
    remove_orphans: true
    # A changed settings file is bind-mounted, so compose cannot see it: recreate explicitly.
    recreate: "{{ 'always' if (radiance_engine_yaml.changed | default(false)) else 'auto' }}"

- name: Wait for the model to load
  when: not ansible_check_mode
  block:
    - name: Wait for the radiance health endpoint
      ansible.builtin.uri:
        url: "http://{{ llm_lan_ip }}:{{ llm_api_port }}/health"
        status_code: 200
      register: radiance_engine_health
      until: radiance_engine_health.status == 200
      retries: "{{ (radiance_engine_health_timeout_minutes | int) * 4 }}"
      delay: 15

    - name: List the served models
      ansible.builtin.uri:
        url: "http://{{ llm_lan_ip }}:{{ llm_api_port }}/v1/models"
        headers:
          Authorization: "Bearer {{ vault_llm_api_key }}"
        return_content: true
      register: radiance_engine_models
      no_log: true

    - name: Show the served model names
      ansible.builtin.debug:
        msg: "Serving: {{ radiance_engine_models.json.data | map(attribute='id') | list }} on port {{ llm_api_port }}"
  rescue:
    - name: Collect the last container log lines
      ansible.builtin.command:
        argv: [docker, logs, --tail, "80", radiance]
      register: radiance_engine_logs
      changed_when: false
      failed_when: false

    - name: Fail loudly with next steps
      ansible.builtin.fail:
        msg: |
          radiance did not become healthy within {{ radiance_engine_health_timeout_minutes }} minutes
          (or /v1/models failed afterwards).
          "Too many open files" / "out of memory" at start: see nofile and the headroom settings
          in group_vars/llm/main.yml (radiance_engine_*). Out of memory on the cards: lower
          the profile's max_model_len or max_num_seqs. Pinned-memory errors:
          lower radiance_engine_host_pool_mib. An "unknown option" line at the top of the log
          means this engine version rejects a flag (for example --rope-scaling): use the card
          profile or remove it.
          Go back to the vLLM stack with: site.yml --tags engine

          Last log lines:
          {{ (radiance_engine_logs.stdout_lines | default([]) + radiance_engine_logs.stderr_lines | default([])) | join('\n') }}
