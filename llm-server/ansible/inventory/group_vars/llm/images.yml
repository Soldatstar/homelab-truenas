---
# Container images, pinned by digest. Tags are comments only.
#
# How to update one image:
#   1. Find the new tag upstream, then resolve its digest on any machine:
#        docker buildx imagetools inspect <image>:<tag>     (prints "Digest: sha256:...")
#      or, without Docker: llm-server/scripts/resolve-digest.sh <image> <tag>
#   2. Replace the digest below and update the tag comment and VERSIONS.md.
#   3. ansible-playbook playbooks/site.yml && ansible-playbook playbooks/smoke-test.yml
#
# vllm-radiance: do not jump to a tag just because it is newer. Check the
# VERSION file of the matching commit (tag sha-<commit>) and upstream's
# qualification docs first; update vllm_radiance_expected_version with it.

# magiccodingman/vllm-radiance:1.0.387 (= sha-1855cd8cdb3b, pushed 2026-09-23)
# VERSION 1.1.0-rc1.vllm0.30.0, the build of the v0.30 qualification publication.
vllm_radiance_image: "docker.io/magiccodingman/vllm-radiance@sha256:c0e8f375de5a461e6aff0761593c85d57f32165b616f073fc3b9971eb702545f"

